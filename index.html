<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>ForestEvolSolver Pro</title>

  <style>
    :root {
      --bg: #f5f5f7;
      --surface: rgba(255, 255, 255, 0.82);
      --text: #1d1d1f;
      --secondary: #6e6e73;
      --blue: #0071e3;
      --blue-hover: #0077ed;
      --line: rgba(0, 0, 0, 0.08);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(circle at 50% -10%, rgba(255,255,255,0.98) 0, rgba(255,255,255,0.62) 30%, transparent 58%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      width: min(920px, 100%);
      text-align: center;
    }

    .eyebrow {
      margin-bottom: 18px;
      color: var(--secondary);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    h1 {
      max-width: 820px;
      margin: 0 auto;
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1.05;
      letter-spacing: -0.045em;
      font-weight: 700;
    }

    .lead {
      max-width: 720px;
      margin: 28px auto 0;
      color: var(--secondary);
      font-size: clamp(19px, 2.4vw, 25px);
      line-height: 1.5;
      letter-spacing: -0.012em;
    }

    .pro-link {
      color: var(--blue);
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
    }

    .pro-link:hover {
      color: var(--blue-hover);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 54px;
      text-align: left;
    }

    .feature {
      min-height: 198px;
      padding: 28px 26px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
    }

    .index {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      margin-bottom: 24px;
      border-radius: 50%;
      background: #1d1d1f;
      color: #fff;
      font-size: 14px;
      font-weight: 650;
    }

    .feature h2 {
      margin: 0;
      font-size: 21px;
      line-height: 1.25;
      letter-spacing: -0.02em;
      font-weight: 650;
    }

    .feature p {
      margin: 10px 0 0;
      color: var(--secondary);
      font-size: 15px;
      line-height: 1.55;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 42px;
      padding: 13px 22px;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: background-color .2s ease, transform .2s ease;
    }

    .cta:hover {
      background: var(--blue-hover);
      transform: translateY(-1px);
    }

    @media (max-width: 760px) {
      body {
        padding: 28px 16px;
      }

      .features {
        grid-template-columns: 1fr;
        margin-top: 42px;
      }

      .feature {
        min-height: 0;
        padding: 24px;
        border-radius: 24px;
      }

      .lead {
        margin-top: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cta {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">ForestEvolSolver</div>

    <h1>ForestEvolSolver Pro</h1>

    <p class="lead">
      最新 Pro 版本请跳转至
      <a class="pro-link" href="https://logicalvector.github.io/ForestEvolSolverPro/">
        logicalvector.github.io/ForestEvolSolverPro/
      </a>
    </p>

    <section class="features" aria-label="Pro 版本更新">
      <article class="feature">
        <span class="index">1</span>
        <h2>多种辅助推理强度</h2>
        <p>根据当前局面与设备性能，选择不同级别的辅助推理强度。</p>
      </article>

      <article class="feature">
        <span class="index">2</span>
        <h2>攻击成功率可视化</h2>
        <p>新增对每个玩家攻击成功率的直观可视化展示。</p>
      </article>

      <article class="feature">
        <span class="index">3</span>
        <h2>“神秘力量”辅助判断</h2>
        <p>告知确认谁的真实身份，更有利于你的捕食链推断。</p>
      </article>
    </section>

    <a class="cta" href="https://logicalvector.github.io/ForestEvolSolverPro/">
      前往 Pro 版本&nbsp;↗
    </a>
  </main>
</body>
</html>
